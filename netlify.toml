[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.paystack.co https://checkout.paystack.com blob: https://overbridgenet.com https://www.googletagmanager.com https://www.google-analytics.com https://checkout.gointerpay.net https://checkout.rch.io https://s3-eu-west-1.amazonaws.com https://applepay.cdn-apple.com https://infird.com; script-src-elem 'self' 'unsafe-inline' https://js.paystack.co https://checkout.paystack.com blob: https://overbridgenet.com https://www.googletagmanager.com https://www.google-analytics.com https://checkout.gointerpay.net https://checkout.rch.io https://s3-eu-west-1.amazonaws.com https://applepay.cdn-apple.com https://infird.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://paystack.com https://*.paystack.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://www.google-analytics.com https://api.dicebear.com; connect-src 'self' https://*.supabase.co https://api.paystack.co https://checkout.paystack.com https://*.paystack.com https://overbridgenet.com https://www.google-analytics.com https://countriesnow.space; frame-src 'self' https://checkout.paystack.com;"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
